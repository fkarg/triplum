site_name: triplum
site_description: Composable, benchmark-first sandbox for LLM knowledge-graph work
repo_url: https://github.com/fkarg/triplum
docs_dir: docs
# Specs and plans are development records: built and searchable, deliberately not in the nav.
not_in_nav: |
  specs/*
  plans/*
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: light mode }
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [python]
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]
            heading_level: 2
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Flow: flow.md
  - Benchmarking and caching: benchmarking.md
  - Modules and interfaces:
      - Overview: api/index.md
      - data: api/data.md
      - cache: api/cache.md
      - llm: api/llm.md
      - embed: api/embed.md
      - rerank: api/rerank.md
      - store: api/store.md
      - retrieve: api/retrieve.md
      - generate: api/generate.md
      - eval: api/eval.md
      - bench: api/bench.md
  - Licences: licences.md
  - Releasing: releasing.md
  - Research:
      - Index: research/README.md
      - Design record: research/design.md
      - Landscape: research/landscape.md
      - Multi-hop QA benchmarks: research/benchmarks-multihop-qa.md
      - Benchmark catalogue: research/benchmarks-catalogue.md
      - Standard benchmarks: research/benchmarks-standard.md
      - Embeddings: research/embeddings.md
      - KG construction: research/kg-construction.md
      - Store comparison: research/store-comparison.md
      - Temporal and permissions: research/temporal-and-permissions.md
      - SQLite storage: research/storage-sqlite.md
      - Rust stack: research/rust-stack.md
      - SOTA discovery: research/sota-discovery.md
      - Paper ledger: research/papers.md
      - Tooling and event logs: research/tooling-event-logs.md
      - Naming: research/naming.md
      - Fact check 2026-09-16: research/fact-check-2026-09-16.md
