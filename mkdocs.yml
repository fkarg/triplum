site_name: triplum
site_description: Composable, benchmark-first sandbox for LLM knowledge-graph work
repo_url: https://github.com/fkarg/triplum
docs_dir: docs
# Development records and temporary notes are built and searchable, outside the nav.
not_in_nav: |
  specs/*
  plans/*
  notes/*
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: light mode }
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_if_no_docstring: true
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]
            heading_level: 2
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Overview: index.md
  - Flow: flow.md
  - Datasets: datasets.md
  - Benchmarking and caching: benchmarking.md
  - Modules and interfaces:
      - Overview: api/index.md
      - data: api/data.md
      - utils.data: api/utils-data.md
      - datasets: api/datasets.md
      - cache: api/cache.md
      - llm: api/llm.md
      - embed: api/embed.md
      - rerank: api/rerank.md
      - store: api/store.md
      - retrieve: api/retrieve.md
      - generate: api/generate.md
      - eval: api/eval.md
      - ingest: api/ingest.md
      - extract: api/extract.md
      - bench: api/bench.md
      - stage: api/stage.md
  - Licences: licences.md
  - Releasing: releasing.md
