site_name: triplum
site_description: Composable, benchmark-first sandbox for GraphRAG applications
repo_url: https://github.com/fkarg/triplum
docs_dir: docs
# Development records are not published or indexed by site search.
exclude_docs: |
  /drafts/
  /specs/
  /plans/
  /notes/
  /personae/
theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - scheme: default
      primary: teal
      toggle: { icon: material/brightness-7, name: dark mode }
    - scheme: slate
      primary: teal
      toggle: { icon: material/brightness-4, name: light mode }
# `serve` only watches docs/ by default; API pages are generated from src/.
watch: [src, scripts]
hooks: [scripts/api_reference.py]
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            extensions:
              - griffe_fieldz:
                  add_fields_to: docstring-attributes
                  remove_fields_from_members: true
            show_if_no_docstring: true
            show_source: true
            show_root_heading: true
            show_root_full_path: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            filters: ["!^_"]
            heading_level: 2
markdown_extensions:
  - admonition
  - tables
  - toc: { permalink: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Overview and Core Concepts:
      - Indexing and retrieval: flow.md
  - Core Concepts:
      - Overview: concepts.md
      - Decision points: concepts/decisions.md
      - Collection: concepts/collection.md
      - Source: concepts/source.md
      - Chunk: concepts/chunk.md
      - Datasets and the DataLoader: concepts/datasets.md
      - Conversion: concepts/conversion.md
      - Chunking: concepts/chunking.md
      - Chunk preprocessing: concepts/chunk-preprocessing.md
      - Embedding: concepts/embedding.md
  - Infrastructure:
      - Store: infrastructure/store.md
      - Fingerprints: infrastructure/fingerprints.md
      - Cache: infrastructure/cache.md
  # Filled with one page per module by scripts/api_reference.py.
  - API reference: []
  - Dependency licences: licences.md
