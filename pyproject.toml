[project]
name = "triplum"
version = "0.0.1"
description = "Composable, benchmark-first sandbox for LLM knowledge-graph construction, GraphRAG and evaluation"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Rust",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "polars>=1.44",
  "pyarrow>=25",
  "numpy>=2.3",
  "sqlite-vec>=0.1.9,<0.2",
  "openai>=3,<4",
  "typer>=0.27",
]

[project.urls]
Repository = "https://github.com/fkarg/triplum"
Documentation = "https://github.com/fkarg/triplum/tree/main/docs"

[project.scripts]
triplum = "triplum.bench.cli:app"

[project.optional-dependencies]
local = ["sentence-transformers>=6", "fastembed>=0.8"]

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.14", "maturin>=1.15,<2", "marimo>=0.24"]
docs = [
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[tool.maturin]
python-source = "python"
module-name = "triplum._core"
manifest-path = "crates/triplum-py/Cargo.toml"
features = ["pyo3/extension-module"]
# The sdist is rooted at the workspace; maturin does not pick up the root LICENSE on its own and
# PyPI rejects an sdist whose License-File entry is missing.
include = [{ path = "LICENSE", format = "sdist" }]

[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "Cargo.toml" }, { file = "crates/**/Cargo.toml" }, { file = "crates/**/*.rs" }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
