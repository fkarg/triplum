[project]
name = "triplum"
version = "0.0.1"
description = "Composable, benchmark-first sandbox for LLM knowledge-graph construction, GraphRAG and evaluation"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Rust",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "polars>=1.44",
  "pyarrow>=25",
  "pydantic>=2.13",
  "pydantic-ai>=2.51.0",
]

[project.urls]
Repository = "https://github.com/fkarg/triplum"
Documentation = "https://github.com/fkarg/triplum/tree/main/docs"
Issues = "https://github.com/fkarg/triplum/issues"

[dependency-groups]
dev = [
    "pytest>=9",
    "ruff>=0.14",
    "pytest-cov>=7.1.0",
    "ty>=0.0.81",
]
docs = [
    "griffe-fieldz>=0.5.0",
    "mkdocs-material>=9.7",
    "mkdocstrings[python]>=1.0",
]

[build-system]
requires = ["uv_build>=0.12.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
# Do not ship artifacts left by the previous Python/Rust extension build.
source-exclude = ["*.so", "*.pyd", "*.dll", "*.dylib"]

[tool.uv]
# Both groups sync by default so `uv run mkdocs build --strict` works on a fresh clone; without
# it `uv run` falls through to a global mkdocs that lacks the material/pymdownx extensions.
default-groups = ["dev", "docs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--durations=10"

[tool.coverage.run]
source = ["src/triplum"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
unused-ignore-comment = "error"
