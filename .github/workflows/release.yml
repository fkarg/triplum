# Build wheels and the sdist on a version tag, then publish to PyPI via trusted publishing.
# Build and publish are separate jobs so only the publish job holds the OIDC credential
# (PyPA guide: packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { runner: ubuntu-latest, target: x86_64, name: linux-x86_64 }
          - { runner: ubuntu-latest, target: aarch64, name: linux-aarch64 }
          - { runner: macos-latest, target: aarch64, name: macos-aarch64 }
          - { runner: macos-15-intel, target: x86_64, name: macos-x86_64 }
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build wheel (abi3, one per platform)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist
          manylinux: auto
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Smoke-test the wheel
        if: matrix.platform.target != 'aarch64' || runner.arch == 'ARM64'
        run: |
          python -m venv .smoke
          . .smoke/bin/activate
          pip install dist/*.whl
          triplum --help
          python -c "import triplum._core as c; print(c.ts_max())"
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-${{ matrix.platform.name }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [wheels, sdist]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/triplum
    permissions:
      id-token: write   # trusted publishing; nothing else in this job
    steps:
      - uses: actions/download-artifact@v7
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - run: ls -l dist
      - uses: pypa/gh-action-pypi-publish@release/v1
