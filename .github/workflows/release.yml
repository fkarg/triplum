# Build a pure-Python wheel and sdist, then publish on a version tag.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Tag must match pyproject version
        if: startsWith(github.ref, 'refs/tags/')
        run: grep -q "^version = \"${GITHUB_REF_NAME#v}\"$" pyproject.toml
      - uses: astral-sh/setup-uv@v7
      - name: Build wheel from source distribution
        run: uv build --no-sources
      - name: Verify distribution contents
        shell: python
        run: |
          from pathlib import Path
          import tarfile
          import zipfile

          wheel, = Path("dist").glob("*.whl")
          assert wheel.name.endswith("-py3-none-any.whl")
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              assert not any(name.endswith((".so", ".pyd", ".dll", ".dylib")) for name in names)
              assert any(name.endswith("/licenses/LICENSE") for name in names)
          sdist, = Path("dist").glob("*.tar.gz")
          with tarfile.open(sdist) as archive:
              assert any(name.endswith("/LICENSE") for name in archive.getnames())
      - name: Smoke-test the wheel
        run: |
          uv venv .smoke --python 3.12
          uv pip install --python .smoke/bin/python dist/*.whl
          .smoke/bin/python -c "import importlib.util; from triplum.utils.data import DataLoader, RecordDataset; from triplum.datasets import FrameDataset; from triplum.cache import Cache; assert importlib.util.find_spec('triplum._core') is None"
      - uses: actions/upload-artifact@v6
        with:
          name: distributions
          path: dist

  publish:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/triplum
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: distributions
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
