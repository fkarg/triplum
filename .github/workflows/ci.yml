name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Sync (builds the Rust extension; optional extras stay out, their tests skip)
        run: uv sync --group dev --group docs
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run cargo check
      - run: uv run ty check
      - run: uv run pytest -q --cov --cov-report=term-missing:skip-covered
      - run: uv run mkdocs build --strict
        if: matrix.os == 'ubuntu-latest'
      - name: Check optional model adapters with their dependencies installed
        run: uv run --extra local ty check
        if: matrix.os == 'macos-latest'
