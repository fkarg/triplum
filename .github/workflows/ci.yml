name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install Python dependencies
        run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: cargo check --locked
      - run: cargo test --locked
      - run: uv run ty check
      - run: uv run pytest -q --cov --cov-report=term-missing:skip-covered
      - run: uv run mkdocs build --strict
